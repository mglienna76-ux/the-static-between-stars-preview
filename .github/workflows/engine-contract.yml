name: Engine 0.3 Certification
"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - chapter-zero-phase2

permissions:
  contents: read

jobs:
  certify:
    name: Invariants and scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Engine 0.3 certification
        run: npm test
      - name: Chapter Zero continuity memory
        run: node tests/chapter-zero-continuity.test.mjs
      - name: Chapter Zero narrative consistency
        run: node tests/chapter-zero-narrative.test.mjs
      - name: Chapter Zero UI smoke tests
        run: npm run test:chapter-zero-ui
